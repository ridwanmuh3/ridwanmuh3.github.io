name = "portfolio-contact"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Public config — anyone who can reach the Worker can infer both.
[vars]
CONTACT_TO = "ridwanmuhraihan@gmail.com"
# Exact origins, comma-separated: scheme + host + port, no trailing slash.
# Update the github.io entry if the site moves to a custom domain.
ALLOWED_ORIGINS = "https://ridwanmuh3.github.io,http://localhost:1313"

# Per-IP send counter — `npx wrangler kv namespace create RATE`.
[[kv_namespaces]]
binding = "RATE"
id = "29d55afc8ecf49668fc9aa3ec57b6146"

# Secrets are NOT set here — this file is committed. Use `wrangler secret put
# RESEND_API_KEY` and `... TURNSTILE_SECRET_KEY`, or .dev.vars for local dev.
