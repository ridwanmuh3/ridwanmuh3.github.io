{{ $name := .name }}
{{ $class := .class | default "size-6" }}
{{ with resources.Get (printf "icons/%s.svg" $name) }}
{{ $svg := .Content | safeHTML }}
<span class="{{ $class }} inline-flex shrink-0 [&>svg]:size-full" aria-hidden="true">{{ $svg }}</span>
{{ else }}
{{ warnf "icon %q not found in assets/icons" $name }}
{{ end }}
