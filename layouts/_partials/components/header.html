<header class="sticky top-[max(1rem,env(safe-area-inset-top))] z-50 mb-4">
    <div class="mx-auto max-w-2xl w-full gutter">
        <div class="header-island surface-raised w-full rounded-lg">
            <nav class="site-nav flex flex-wrap items-center gap-x-3 px-4 py-2 sm:grid sm:grid-cols-[1fr_auto_1fr] sm:gap-x-4"
                aria-label="{{ i18n " nav_main" }}">
                {{/* no leading slash: relURL must stay a no-op-free relative path under /portfolio/ */}}
                <a href="{{ site.Home.RelPermalink }}" class="order-1 max-sm:me-auto sm:justify-self-start"
                    aria-label="{{ i18n " nav_home" .Site.Params.fullname }}">
                    <span
                        class="block bg-linear-to-b from-amber-300 from-10% to-amber-700 bg-clip-text font-header font-black text-3xl sm:text-4xl text-transparent leading-none">R</span>
                </a>
                <ul id="site-menu"
                    class="site-menu order-3 w-[calc(100%+2rem)] -mx-4 mt-2 px-4 flex flex-col border-t border-line text-sm font-header sm:order-2 sm:mt-0 sm:w-auto sm:mx-0 sm:px-0 sm:border-0 sm:flex-row sm:items-center sm:gap-6 sm:justify-self-center">
                    {{ range site.Menus.main }}
                    <li>
                        <a href="{{ .URL }}" class="link-quiet block py-3 sm:py-0">{{ .Name }}</a>
                    </li>
                    {{ end }}
                </ul>
                <div class="max-sm:contents sm:order-3 sm:flex sm:items-center sm:gap-2 sm:justify-self-end">
                    {{ partial "components/lang-switcher.html" . }}
                    <a href='{{ "contact/" | relURL }}'
                        class="site-cta btn-accent inline-block whitespace-nowrap text-sm px-3 py-3 sm:px-4 sm:py-1.5 max-sm:order-4 max-sm:basis-full max-sm:mt-2 max-sm:text-center">{{
                        i18n "hire_me" }}</a>
                    <button type="button"
                        class="site-nav-toggle link-quiet -me-2 inline-flex items-center justify-center p-3 max-sm:order-2 sm:hidden cursor-pointer"
                        aria-controls="site-menu" aria-expanded="false" aria-label="{{ i18n " nav_menu" }}">
                        <span class="icon-open inline-flex">{{ partial "components/icon.html" (dict "name" "menu"
                            "class" "size-5") }}</span>
                        <span class="icon-close inline-flex">{{ partial "components/icon.html" (dict "name" "close"
                            "class" "size-5") }}</span>
                    </button>
                </div>
            </nav>
        </div>
    </div>
</header>
