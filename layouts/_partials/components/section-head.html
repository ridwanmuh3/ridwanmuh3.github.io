<div class="space-y-4">
    {{ if eq (.level | default "h2") "h1" }}
    <h1 class="type-display text-accent w-fit text-balance">{{ .title }}</h1>
    {{ else }}
    <h2 class="type-section text-accent w-fit text-balance">{{ .title }}</h2>
    {{ end }}
    {{ with .body }}
    <p class="type-body measure">{{ . }}</p>
    {{ end }}
    {{ with .content }}
    <div class="type-body measure">{{ . }}</div>
    {{ end }}
</div>
