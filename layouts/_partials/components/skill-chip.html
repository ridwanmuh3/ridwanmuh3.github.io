{{ $name := .name }}
{{ $slug := .slug | default (lower (urlize $name)) }}
<li class="surface-raised rounded-lg p-3 flex items-center justify-center shrink-0 text-ink"
    title="{{ $name }}" aria-label="{{ $name }}">
    {{ partial "components/icon.html" (dict "name" $slug "class" "size-6") }}
</li>
