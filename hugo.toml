baseURL = 'https://example.org/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Ridwan portfolio site'

# Indonesian is kept in full but not built; delete this line to re-enable it.
# Must stay above the first [table] header, or TOML reads it as a key of that table.
disableLanguages = ['id']
enableRobotsTXT = true
# Empty until content uses them.
disableKinds = ['taxonomy', 'term']

[params]
author = "ridwanmuh3"
fullname = "Ridwan M. Raihan"
role = "Backend Developer"

# Both values are public; secrets live in the Worker. Empty `endpoint` = no form rendered.
[params.contact]
endpoint = "https://portfolio-contact.ridwanmuh3.workers.dev"
turnstileSiteKey = "0x4AAAAAAEK5YpgnLFRwX4pR"

# giscus IDs are GraphQL node IDs, not the names beside them. Empty repoId = no comments.
[params.giscus]
repo = "ridwanmuh3/portfolio"
repoId = "R_kgDOTzB6UA"
category = "Announcements"
categoryId = "DIC_kwDOTzB6UM4DC_N4"

[languages]
[languages.en]
locale = 'en-US'
label = 'English'
weight = 1
contentDir = 'content/en'
title = 'Ridwan portfolio site'
[languages.en.params]
bio = "Backend engineer working with Go, PostgreSQL, and Redis on Linux and Google Cloud."
[languages.en.menus]
[[languages.en.menus.main]]
name = 'Projects'
pageRef = '/projects'
weight = 10

[[languages.en.menus.main]]
name = 'Contact'
pageRef = '/contact'
weight = 30

[languages.id]
locale = 'id-ID'
label = 'Bahasa Indonesia'
weight = 2
contentDir = 'content/id'
title = 'Situs portofolio Ridwan'
[languages.id.params]
bio = "Backend engineer dengan Go, PostgreSQL, dan Redis pada Linux dan Google Cloud."
[languages.id.menus]
[[languages.id.menus.main]]
name = 'Proyek'
pageRef = '/projects'
weight = 10

[[languages.id.menus.main]]
name = 'Kontak'
pageRef = '/contact'
weight = 30

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

[sitemap]
changefreq = 'weekly'
priority = 0.5
filename = 'sitemap.xml'

[caches]
[caches.images]
dir = ':cacheDir/images'
