baseURL = 'https://example.org/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Ridwan portfolio site'

# English only for now. The Indonesian translation is kept in full (content/id,
# data/id, i18n/id.toml, [languages.id]) and simply not built — delete this line
# to bring it back. Must stay above the first [table] header, or TOML reads it
# as a key of that table.
disableLanguages = ['id']

[params]
author = "ridwanmuh3"
fullname = "Ridwan M. Raihan"
role = "Backend Engineer"

# Contact form. Both values are public by design; the secrets live only in the
# Worker (workers/contact/README.md). An empty `endpoint` means no form is
# rendered and the build warns — point it at http://localhost:8787 to test
# against `wrangler dev`.
[params.contact]
endpoint = "https://portfolio-contact.ridwanmuh3.workers.dev"
turnstileSiteKey = "0x4AAAAAAEK5YpgnLFRwX4pR"

# Blog comments via giscus. Needs a public repo with Discussions enabled and the
# giscus app installed. The IDs are GraphQL node IDs, not the names beside them:
#
#   gh api graphql -f query='query { repository(owner:"ridwanmuh3", name:"portfolio") {
#     id  discussionCategories(first:20){ nodes { id name } } } }'
#
# Empty `repoId` means no comment section, and the build warns. Announcements is
# announcement-type, so only the maintainer can open a thread.
[params.giscus]
repo = "ridwanmuh3/portfolio"
repoId = "R_kgDOTzB6UA"
category = "Announcements"
categoryId = "DIC_kwDOTzB6UM4DC_N4"

[languages]
[languages.en]
locale = 'en-US'
label = 'English'
weight = 1
contentDir = 'content/en'
title = 'Ridwan portfolio site'
[languages.en.params]
bio = "Backend engineer working with Go, PostgreSQL, and Redis on Linux and Google Cloud."
[languages.en.menus]
[[languages.en.menus.main]]
name = 'Projects'
pageRef = '/projects'
weight = 10
[[languages.en.menus.main]]
name = 'Blogs'
pageRef = '/blogs'
weight = 20
[[languages.en.menus.main]]
name = 'Contact'
pageRef = '/contact'
weight = 30

[languages.id]
locale = 'id-ID'
label = 'Bahasa Indonesia'
weight = 2
contentDir = 'content/id'
title = 'Situs portofolio Ridwan'
[languages.id.params]
bio = "Backend engineer dengan Go, PostgreSQL, dan Redis pada Linux dan Google Cloud."
[languages.id.menus]
[[languages.id.menus.main]]
name = 'Proyek'
pageRef = '/projects'
weight = 10
[[languages.id.menus.main]]
name = 'Blog'
pageRef = '/blogs'
weight = 20
[[languages.id.menus.main]]
name = 'Kontak'
pageRef = '/contact'
weight = 30

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

[caches]
[caches.images]
dir = ':cacheDir/images'
